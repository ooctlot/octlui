[workspace]
resolver = "2"
members = ["crates/octlui", "crates/octlui-macros", "crates/octlui-examples"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ooctlot/octlui"
authors = ["ooctlot"]

[workspace.dependencies]
octlui-macros = { path = "crates/octlui-macros", version = "0.1.0" }
winit = "=0.31.0-beta.4"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
